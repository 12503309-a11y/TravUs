<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색</title>
    <link rel="stylesheet" href="../css/search.css">
    <link rel="stylesheet" href="../css/font.css">
</head>
<body>
    <div class="wrap">
        <!-- header -->
        <header class="header">
            <div class="inner-header">
                <div class="icon-box">
                    <img src="../img/back-icon.svg" alt="뒤로가기">
                    <div class="search-box"><img src="../img/searsh-icon.svg" alt="검색"></div>
                </div>
            </div>
        </header>

<!-- Recent searches -->
        <section class="swiper recent-searches">
            <h2>최근 검색어</h2>
            <div class="swiper-wrapper recent-swiper">
                    <p class="swiper-slide">파리</p>
                    <p class="swiper-slide">프랑스</p>
                    <p class="swiper-slide">에펠탑</p>
                    <p class="swiper-slide">숙소</p>
                    <p class="swiper-slide">루부르 박물관</p>
                    <p class="swiper-slide">프랑스 맛집</p>
            </div>
        </section>


        <!--popular travel destinations  -->
        <section class="swiper popular-travel-card">
            <h2>지금 인기있는 여행지</h2>

            <div class="swiper-wrapper card-box-swiper">

                <div class="swiper-slide">
                    <div class="card card1">
                        <div class="txt-box">
                            <p class="name">나트랑</p>
                            <p class="ex">2025 동남아 예매율 1위! <br>최고의 휴양지</p>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="card card2">
                        <div class="txt-box">
                            <p class="name">이탈리아</p>
                            <p class="ex">역사의 현장 이탈리아! <br>중세의 아름다움이 가득한 곳</p>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="card card3">
                        <div class="txt-box">
                            <p class="name">이집트</p>
                            <p class="ex">파라오의 무덤! <br>여러 유물과 역사체험!</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="../js/script01.js"></script>
</body>
</body>
</html>
