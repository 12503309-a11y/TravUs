<!DOCTYPE html>
<html lang="kr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>번역</title>
    <link rel="stylesheet" href="../css/translation.css">
    <script src="../js/translation.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>

<body>
    <div class="wrap">
        <!-- header -->
        <header>
            <div class="inner-header">
                <div class="icon-box">
                    <button><img src="../img/back-icon.svg" alt=""></button>
                    <p class="title">번역</p>
                </div>
                
            </div>
        </header>

        
        <!-- Select country -->
        <section class="select-country">
            <div class="select-box">
                <div class="country1">
                    <button><img src="../img/down-arrow.svg" alt=""></button>
                    <p class="language">한국어</p>
                </div>
                <button class="change"><img src="../img/change.svg" alt=""></button>
                <div class="country1">
                    <p class="language">프랑스어</p>
                    <button><img src="../img/down-arrow.svg" alt=""></button>
                </div>
            </div>
        </section>

        <!-- translation-box -->
        <section class="translation-box">
            <div class="box one">
                <button><img src="../img/no-sound.svg" alt=""></button>
                <p>이 가게에서 가장 인기있는 메뉴는 무엇인가요?</p>
            </div>
            <div class="box two">
                <button><img src="../img/sound.svg" alt=""></button>
                <p>Quel est le plat le plus populaire du menu de ce restaurant?</p>
            </div>
        </section>

        <!-- often -->
        <section class="often">
            <p class="sub-tit">자주 쓰는 문장</p>

            <div class="often-scroll">
                <div class="sentence-box">
                <p>메뉴판 주세요</p>
                <p>이거 얼마인가요?</p>
                <p>화장실은 어디에 있나요?</p>
                <p>체크인 할게요</p>
                <p>체크아웃 할게요</p>
                </div>
            </div>
        </section>
