        <div id="map" class="map"></div>

        <header class="header">
            <div class="inner-header">
                <div class="icon-box">
                    <a href="#"><img src="../img/back-icon.svg" alt=""></a>
                    <span class="title">지도</span>
                    <p class="date">Day 2</p>
                </div>
            </div>
        </header>

        <div class="search-box">
            <p>루브르 박물관</p>
            <img src="../img/searsh-icon.svg" alt="검색">
        </div>

        <!-- btn -->
        <section class="swiper category ">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <button class="chip">
                        <img src="../img/cart.svg" alt="">편의점

                </div>

                    <button class="chip">
                        <img src="../img/food.svg" alt="">음식점

                </div>

                    </button>
                </div>
                <div class="swiper-slide">
                    <button class="chip atm">
                        <img src="../img/atm.svg" alt="">atm
                    </button>
                </div>
            </div>
        </section>

        <!-- card -->
        <section class="swiper bottom-box">
            <div class="swiper-wrapper card-box-swiper">
                <div class="swiper-slide">
                    <div class="map-card">
                        <div class="card-inner">
                            <img src="../img/map-park-hyatt.svg" alt="">
                            <div class="txt-box">
                                <b>Now</b>
                                <p class="name">Park Hyatt Hotel</p>
                                <p class="address">5 Rue de la Paix, 75002 Paris, 프랑스</p>
                            </div>
                        </div>
                        <a href="#" class="next"><img src="../img/map-or-btn.svg" alt=""></a>
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="map-card">
                        <div class="card-inner">
                            <img src="../img/map-louvre.svg" alt="">
                            <div class="txt-box">
                                <b>NEXT</b>
                                <p class="name">Musée du Louvre</p>
                                <p class="address">프랑스 75001 Paris</p>
                            </div>
                        </div>
                        <a href="#" class="next"><img src="../img/map-or-btn.svg" alt=""></a>
                    </div>
                </div>
            </div>
        </section>
